<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI润色 - AI智能工具箱</title>
    <meta name="description" content="免费在线AI润色工具，输入文本自动优化润色，支持学术、商务、文学、日常等多种风格。">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors">
    <!-- 顶部导航栏 -->
    <nav class="fixed top-0 left-0 right-0 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md shadow-sm z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <a href="../index.html" class="flex items-center space-x-2">
                    <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-blue-500 rounded-lg flex items-center justify-center">
                        <i class="fas fa-magic text-white text-xl"></i>
                    </div>
                    <span class="text-xl font-bold bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">
                        AI智能工具箱
                    </span>
                </a>
                
                <!-- 导航 -->
                <div class="hidden md:flex items-center space-x-4">
                    <a href="../index.html" class="text-gray-600 dark:text-gray-300 hover:text-purple-600 dark:hover:text-purple-400 transition-colors">
                        <i class="fas fa-home mr-1"></i>首页
                    </a>
                    <a href="rewrite.html" class="text-gray-600 dark:text-gray-300 hover:text-purple-600 dark:hover:text-purple-400 transition-colors">
                        <i class="fas fa-sync-alt mr-1"></i>AI改写
                    </a>
                    <a href="polish.html" class="text-purple-600 dark:text-purple-400 font-medium">
                        <i class="fas fa-spell-check mr-1"></i>AI润色
                    </a>
                </div>
                
                <!-- 暗色/亮色切换 -->
                <button id="theme-toggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:block"></i>
                </button>
                
                <!-- 移动端菜单按钮 -->
                <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg text-gray-600 dark:text-gray-300">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
        </div>
        
        <!-- 移动端菜单 -->
        <div id="mobile-menu" class="hidden md:hidden bg-white dark:bg-gray-800 border-t dark:border-gray-700">
            <div class="px-4 py-3 space-y-2">
                <a href="../index.html" class="block py-2 text-gray-600 dark:text-gray-300 hover:text-purple-600">
                    <i class="fas fa-home mr-2"></i>首页
                </a>
                <a href="rewrite.html" class="block py-2 text-gray-600 dark:text-gray-300 hover:text-purple-600">
                    <i class="fas fa-sync-alt mr-2"></i>AI改写
                </a>
                <a href="polish.html" class="block py-2 text-purple-600 dark:text-purple-400">
                    <i class="fas fa-spell-check mr-2"></i>AI润色
                </a>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <main class="pt-24 pb-16 px-4 sm:px-6 lg:px-8">
        <div class="max-w-5xl mx-auto">
            <!-- 页面标题 -->
            <div class="text-center mb-8">
                <h1 class="text-3xl sm:text-4xl font-bold mb-4">
                    <span class="bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                        AI智能润色
                    </span>
                </h1>
                <p class="text-gray-500 dark:text-gray-400 max-w-2xl mx-auto">
                    输入文本，AI自动优化润色，让你的文字更加优美流畅
                </p>
                
                <!-- 免费提示 -->
                <div class="mt-4 inline-flex items-center px-4 py-2 bg-green-100 dark:bg-green-900/30 rounded-full">
                    <i class="fas fa-gift text-green-600 mr-2"></i>
                    <span class="text-sm text-green-700 dark:text-green-300">
                        每天免费使用 20 次
                    </span>
                </div>
            </div>
            
            <!-- 主工具区域 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- 左侧：输入 -->
                <div class="lg:col-span-1">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm h-full">
                        <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">
                            <i class="fas fa-edit mr-2 text-indigo-500"></i>原文输入
                        </h3>
                        
                        <textarea id="input-text" rows="10" placeholder="输入需要润色的文本..."
                            class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 focus:border-purple-500 focus:outline-none resize-none"></textarea>
                        
                        <div class="mt-4 flex items-center justify-between text-sm text-gray-500 dark:text-gray-400">
                            <span id="char-count">0</span> / 2000 字
                        </div>
                        
                        <!-- 润色方向选择 -->
                        <div class="mt-6">
                            <label class="setting-label">
                                <i class="fas fa-bullseye mr-2"></i>润色方向
                            </label>
                            <div class="space-y-2">
                                <label class="flex items-center gap-3 p-3 rounded-xl bg-gray-50 dark:bg-gray-700 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors">
                                    <input type="radio" name="polish-mode" value="academic" checked class="accent-purple-600">
                                    <div>
                                        <span class="font-medium text-gray-700 dark:text-gray-200">学术</span>
                                        <p class="text-xs text-gray-500">严谨规范，适合论文报告</p>
                                    </div>
                                </label>
                                <label class="flex items-center gap-3 p-3 rounded-xl bg-gray-50 dark:bg-gray-700 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors">
                                    <input type="radio" name="polish-mode" value="business" class="accent-purple-600">
                                    <div>
                                        <span class="font-medium text-gray-700 dark:text-gray-200">商务</span>
                                        <p class="text-xs text-gray-500">专业得体，适合商务邮件</p>
                                    </div>
                                </label>
                                <label class="flex items-center gap-3 p-3 rounded-xl bg-gray-50 dark:bg-gray-700 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors">
                                    <input type="radio" name="polish-mode" value="literary" class="accent-purple-600">
                                    <div>
                                        <span class="font-medium text-gray-700 dark:text-gray-200">文学</span>
                                        <p class="text-xs text-gray-500">优美流畅，适合文学创作</p>
                                    </div>
                                </label>
                                <label class="flex items-center gap-3 p-3 rounded-xl bg-gray-50 dark:bg-gray-700 cursor-pointer hover:bg-gray-100 dark:hover:bg-gray-600 transition-colors">
                                    <input type="radio" name="polish-mode" value="daily" class="accent-purple-600">
                                    <div>
                                        <span class="font-medium text-gray-700 dark:text-gray-200">日常</span>
                                        <p class="text-xs text-gray-500">自然亲切，适合日常交流</p>
                                    </div>
                                </label>
                            </div>
                        </div>
                        
                        <button id="btn-polish" class="btn-primary w-full mt-6 text-lg">
                            <i class="fas fa-wand-magic-sparkles mr-2"></i>开始润色
                        </button>
                    </div>
                </div>
                
                <!-- 右侧：输出 -->
                <div class="lg:col-span-2">
                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm h-full">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-semibold text-gray-800 dark:text-white">
                                <i class="fas fa-check-circle mr-2 text-indigo-500"></i>润色结果
                            </h3>
                            <button id="btn-copy" class="btn-secondary text-sm hidden">
                                <i class="fas fa-copy mr-1"></i>复制结果
                            </button>
                        </div>
                        
                        <!-- 加载状态 -->
                        <div id="loading-section" class="hidden">
                            <div class="flex flex-col items-center justify-center py-12">
                                <div class="loading-spinner mb-4"></div>
                                <span class="text-gray-500 dark:text-gray-400">AI正在润色中...</span>
                                <p class="text-xs text-gray-400 mt-2">请稍候，润色可能需要一些时间</p>
                            </div>
                        </div>
                        
                        <!-- 输出区域 -->
                        <div id="output-section">
                            <div id="result-placeholder" class="flex flex-col items-center justify-center py-16 text-gray-400">
                                <i class="fas fa-sparkles text-6xl mb-4 opacity-30"></i>
                                <p>润色结果将显示在这里</p>
                            </div>
                            
                            <div id="result-content" class="hidden">
                                <div id="result-text" class="prose dark:prose-invert max-w-none min-h-[300px] px-4 py-3 rounded-xl bg-gray-50 dark:bg-gray-700 text-gray-700 dark:text-gray-200 whitespace-pre-wrap leading-relaxed"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 广告位 -->
            <div class="mt-8">
                <div class="ad-placeholder" data-size="728x90">
                    <span class="text-gray-400">广告位 728x90</span>
                </div>
            </div>
            
            <!-- 使用技巧 -->
            <div class="mt-8 bg-indigo-50 dark:bg-indigo-900/20 rounded-2xl p-6">
                <h3 class="text-lg font-semibold text-indigo-700 dark:text-indigo-300 mb-4">
                    <i class="fas fa-lightbulb mr-2"></i>使用技巧
                </h3>
                <ul class="space-y-2 text-sm text-indigo-600 dark:text-indigo-400">
                    <li>• 选择与你的目标场景匹配的润色方向</li>
                    <li>• 输入的原文质量越好，润色效果越佳</li>
                    <li>• 如对润色结果不满意，可以调整方向重新润色</li>
                    <li>• 重要文档建议润色后自行检查确认</li>
                </ul>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-gray-100 dark:bg-gray-800 border-t dark:border-gray-700 py-8">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-gray-500 dark:text-gray-400 text-sm">
                © 2024 AI智能工具箱 - 免费提供高质量在线AI工具
            </p>
        </div>
    </footer>

    <!-- Toast 容器 -->
    <div id="toast-container"></div>

    <script src="polish.js"></script>
</body>
</html>
