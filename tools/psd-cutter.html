<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSD在线切图 - AI智能工具箱</title>
    <meta name="description" content="免费的在线PSD切图工具，无需安装软件，直接在浏览器中解析PSD图层并导出PNG/JPG素材。">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- JSZip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors">
    <!-- 顶部导航栏 -->
    <nav class="fixed top-0 left-0 right-0 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md shadow-sm z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <a href="../index.html" class="flex items-center space-x-2">
                    <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-blue-500 rounded-lg flex items-center justify-center">
                        <i class="fas fa-magic text-white text-xl"></i>
                    </div>
                    <span class="text-xl font-bold bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">
                        AI智能工具箱
                    </span>
                </a>
                
                <!-- 导航 -->
                <div class="hidden md:flex items-center space-x-4">
                    <a href="../index.html" class="text-gray-600 dark:text-gray-300 hover:text-purple-600 dark:hover:text-purple-400 transition-colors">
                        <i class="fas fa-home mr-1"></i>首页
                    </a>
                    <a href="psd-cutter.html" class="text-purple-600 dark:text-purple-400 font-medium">
                        <i class="fas fa-cut mr-1"></i>PSD切图
                    </a>
                    <a href="remove-bg.html" class="text-gray-600 dark:text-gray-300 hover:text-purple-600 dark:hover:text-purple-400 transition-colors">
                        <i class="fas fa-eraser mr-1"></i>AI去背景
                    </a>
                </div>
                
                <!-- 暗色/亮色切换 -->
                <button id="theme-toggle" class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:block"></i>
                </button>
                
                <!-- 移动端菜单按钮 -->
                <button id="mobile-menu-btn" class="md:hidden p-2 rounded-lg text-gray-600 dark:text-gray-300">
                    <i class="fas fa-bars text-xl"></i>
                </button>
            </div>
        </div>
        
        <!-- 移动端菜单 -->
        <div id="mobile-menu" class="hidden md:hidden bg-white dark:bg-gray-800 border-t dark:border-gray-700">
            <div class="px-4 py-3 space-y-2">
                <a href="../index.html" class="block py-2 text-gray-600 dark:text-gray-300 hover:text-purple-600">
                    <i class="fas fa-home mr-2"></i>首页
                </a>
                <a href="psd-cutter.html" class="block py-2 text-purple-600 dark:text-purple-400">
                    <i class="fas fa-cut mr-2"></i>PSD切图
                </a>
                <a href="remove-bg.html" class="block py-2 text-gray-600 dark:text-gray-300 hover:text-purple-600">
                    <i class="fas fa-eraser mr-2"></i>AI去背景
                </a>
            </div>
        </div>
    </nav>

    <!-- 主内容区域 -->
    <main class="pt-24 pb-16 px-4 sm:px-6 lg:px-8">
        <div class="max-w-7xl mx-auto">
            <!-- 页面标题 -->
            <div class="text-center mb-8">
                <h1 class="text-3xl sm:text-4xl font-bold mb-4">
                    <span class="bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent">
                        PSD在线切图
                    </span>
                </h1>
                <p class="text-gray-500 dark:text-gray-400 max-w-2xl mx-auto">
                    上传PSD文件，在线解析图层结构，自定义切图设置，一键导出PNG/JPG素材
                </p>
            </div>
            
            <div class="flex flex-col lg:flex-row gap-8">
                <!-- 左侧：上传和预览区域 -->
                <div class="flex-1">
                    <!-- 上传区域 -->
                    <div id="upload-section">
                        <div id="upload-zone" class="upload-zone">
                            <i class="fas fa-cloud-upload-alt"></i>
                            <h3>拖拽PSD文件到此处</h3>
                            <p>或点击选择文件</p>
                            <p class="mt-2 text-sm">支持 .psd 格式，最大 50MB</p>
                            <input type="file" id="file-input" accept=".psd" class="hidden">
                        </div>
                    </div>
                    
                    <!-- 加载状态 -->
                    <div id="loading-section" class="hidden">
                        <div class="bg-white dark:bg-gray-800 rounded-2xl p-8 shadow-sm text-center">
                            <div class="loading-spinner mx-auto mb-4"></div>
                            <p class="text-gray-600 dark:text-gray-300 mb-2">正在解析PSD文件...</p>
                            <p class="text-sm text-gray-400" id="loading-status">读取图层结构中</p>
                            <div class="progress-container mt-4">
                                <div class="progress-bar" id="loading-progress" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 预览区域 -->
                    <div id="preview-section" class="hidden">
                        <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm">
                            <!-- PSD信息 -->
                            <div class="flex items-center justify-between mb-4 pb-4 border-b dark:border-gray-700">
                                <div>
                                    <h3 class="text-lg font-semibold text-gray-800 dark:text-white" id="psd-name">未命名.psd</h3>
                                    <p class="text-sm text-gray-500 dark:text-gray-400" id="psd-info">0 图层 | 0x0 像素</p>
                                </div>
                                <button id="btn-reset" class="btn-secondary text-sm">
                                    <i class="fas fa-redo mr-1"></i>重新上传
                                </button>
                            </div>
                            
                            <!-- 切图进度 -->
                            <div id="cutting-progress" class="hidden mb-4">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-sm text-gray-600 dark:text-gray-300">切图进度</span>
                                    <span class="text-sm text-gray-600 dark:text-gray-300" id="cutting-status">0/0</span>
                                </div>
                                <div class="progress-container">
                                    <div class="progress-bar" id="cutting-progress-bar" style="width: 0%"></div>
                                </div>
                            </div>
                            
                            <!-- 预览图片 -->
                            <div class="preview-container">
                                <div class="preview-box">
                                    <img id="preview-image" src="" alt="PSD预览">
                                    <p class="preview-label">PSD缩略图</p>
                                </div>
                                <div class="preview-box" id="composite-preview-box">
                                    <canvas id="composite-canvas"></canvas>
                                    <p class="preview-label">图层合成预览</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 右侧：设置和图层列表 -->
                <div class="lg:w-96">
                    <!-- 切图设置 -->
                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm mb-6">
                        <h3 class="text-lg font-semibold text-gray-800 dark:text-white mb-4">
                            <i class="fas fa-cog mr-2 text-purple-600"></i>切图设置
                        </h3>
                        
                        <div class="setting-group">
                            <label class="setting-label">输出格式</label>
                            <select id="output-format" class="setting-select">
                                <option value="png">PNG（支持透明）</option>
                                <option value="jpg">JPG（不支持透明）</option>
                            </select>
                        </div>
                        
                        <div class="setting-group">
                            <label class="setting-label">JPG质量</label>
                            <select id="jpg-quality" class="setting-select">
                                <option value="0.8">80%</option>
                                <option value="0.9">90%</option>
                                <option value="1.0" selected>100%</option>
                            </select>
                        </div>
                        
                        <div class="setting-group">
                            <div class="setting-checkbox">
                                <input type="checkbox" id="auto-crop" checked>
                                <label for="auto-crop" class="text-sm text-gray-600 dark:text-gray-300">自动裁剪透明区域</label>
                            </div>
                        </div>
                        
                        <div class="setting-group">
                            <div class="setting-checkbox">
                                <input type="checkbox" id="include-hidden">
                                <label for="include-hidden" class="text-sm text-gray-600 dark:text-gray-300">包含隐藏图层</label>
                            </div>
                        </div>
                        
                        <div class="setting-group">
                            <div class="setting-checkbox">
                                <input type="checkbox" id="use-prefix" checked>
                                <label for="use-prefix" class="text-sm text-gray-600 dark:text-gray-300">启用前缀规则</label>
                            </div>
                        </div>
                        
                        <div class="setting-group">
                            <div class="setting-checkbox">
                                <input type="checkbox" id="group-subdir" checked>
                                <label for="group-subdir" class="text-sm text-gray-600 dark:text-gray-300">按图层组创建子目录</label>
                            </div>
                        </div>
                        
                        <div class="setting-group">
                            <div class="setting-checkbox">
                                <input type="checkbox" id="min-size-filter">
                                <label for="min-size-filter" class="text-sm text-gray-600 dark:text-gray-300">过滤小尺寸图层（&lt;10px）</label>
                            </div>
                        </div>
                        
                        <div class="setting-group">
                            <label class="setting-label">内边距 (px)</label>
                            <input type="number" id="padding" class="setting-select" value="0" min="0" max="50">
                        </div>
                    </div>
                    
                    <!-- 图层列表 -->
                    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 shadow-sm">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-lg font-semibold text-gray-800 dark:text-white">
                                <i class="fas fa-layer-group mr-2 text-purple-600"></i>图层列表
                            </h3>
                            <div class="flex gap-2">
                                <button id="btn-expand-all" class="text-sm text-purple-600 hover:text-purple-800">
                                    展开
                                </button>
                                <button id="btn-collapse-all" class="text-sm text-gray-500 hover:text-gray-700">
                                    折叠
                                </button>
                            </div>
                        </div>
                        
                        <!-- 全选控制 -->
                        <div class="flex items-center gap-4 mb-4 pb-4 border-b dark:border-gray-700">
                            <div class="setting-checkbox">
                                <input type="checkbox" id="select-all-layers" checked>
                                <label for="select-all-layers" class="text-sm text-gray-600 dark:text-gray-300">全选</label>
                            </div>
                            <span class="text-sm text-gray-500 dark:text-gray-400" id="selected-count">已选择: 0 个</span>
                        </div>
                        
                        <div id="layer-tree" class="layer-tree">
                            <p class="text-gray-500 text-center py-8">请先上传PSD文件</p>
                        </div>
                    </div>
                    
                    <!-- 开始切图按钮 -->
                    <div class="mt-6">
                        <button id="btn-start-cut" class="btn-primary w-full text-lg" disabled>
                            <i class="fas fa-cut mr-2"></i>开始切图
                        </button>
                    </div>
                    
                    <!-- 广告位 -->
                    <div class="mt-6">
                        <div class="ad-placeholder" data-size="300x250">
                            <span class="text-gray-400">广告位 300x250</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 底部广告位 -->
            <div class="mt-8">
                <div class="ad-placeholder" data-size="728x90">
                    <span class="text-gray-400">广告位 728x90</span>
                </div>
            </div>
        </div>
    </main>

    <!-- 页脚 -->
    <footer class="bg-gray-100 dark:bg-gray-800 border-t dark:border-gray-700 py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <p class="text-gray-500 dark:text-gray-400 text-sm">
                &copy; 2024 AI智能工具箱. All rights reserved.
            </p>
        </div>
    </footer>

    <!-- 引入脚本 -->
    <script src="../js/main.js"></script>
    <script src="psd-cutter.js"></script>
</body>
</html>
